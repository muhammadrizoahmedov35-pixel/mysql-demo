
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Mehmonlar kitobi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 450px;
      margin: 40px auto;
      text-align: center;
    }
    input, button {
      padding: 12px;
      width: 90%;
      margin: 10px 0;
      border-radius: 8px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mehmonlar kitobi</h1>
    <p>Ismingizni kiriting</p>
    <input id="name" placeholder="Ismingiz">
    <button>Saqlash</button>
    <h3>Mehmonlar ro'yxati</h3>
    <div id="list"></div>
  </div>
  
<script>
const input = document.getElementById("name");
const list = document.getElementById("list");
const button = document.querySelector("button");

button.addEventListener("click", function () {
  const name = input.value.trim();

  if (!name) {
    alert("Iltimos, ismingizni kiriting!");
    return;
  }

  const item = document.createElement("p");
  item.textContent = name;
  list.appendChild(item);

  input.value = "";
});
</script>

</body>
</html>
