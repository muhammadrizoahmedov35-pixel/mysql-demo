
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Mehmonlar kitobi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 450px;
      margin: 40px auto;
      text-align: center;
    }
    input, button {
      padding: 12px;
      width: 90%;
      margin: 10px 0;
      border-radius: 8px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Mehmonlar kitobi</h1>
    <p>Ismingizni kiriting</p>
    <input id="name" placeholder="Ismingiz">
    <button>Saqlash</button>
    <h3>Mehmonlar ro'yxati</h3>
    <div id="list"></div>
  </div>
  
<script>

const input = document.getElementById("name");
const list = document.getElementById("list");
const button = document.querySelector("button");

async function loadNames() {
  try {
    const response = await fetch("/api");
    if (!response.ok) throw new Error("Load failed");

    const names = await response.json();
    list.innerHTML = "";

    names.forEach(item => {
      const p = document.createElement("p");
     const date = item.created_at
  ? new Date(item.created_at).toLocaleString("uz-UZ", {
      timeZone: "Europe/Istanbul",
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    })
  : "Sana noma'lum";

p.textContent =
  item.name + " 🌍 " + (item.country || "Unknown") +
  " 📅 " + date;
      list.appendChild(p);
    });
  } catch (error) {
    alert("Ismlarni yuklashda xatolik!");
  }
}

button.addEventListener("click", async () => {
  const name = input.value.trim();

  if (!name || name.length > 100) {
    alert("1 dan 100 tagacha belgi kiriting!");
    return;
  }

  button.disabled = true;

  try {
    const response = await fetch("/api", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name })
    });

    if (!response.ok) throw new Error("Save failed");

    input.value = "";
    await loadNames();
  } catch (error) {
    alert("Ismni saqlashda xatolik!");
  } finally {
    button.disabled = false;
  }
});

loadNames();

</script>
  <!-- Redeploy -->

</body>
</html>
